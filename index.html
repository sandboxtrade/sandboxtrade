<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Финансовая песочница: государство, 30–40 тысяч жителей, банки, фонды и компании с замкнутым учётом денег."><meta name="theme-color" content="#101113"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>STATE / Финансовая песочница</title><style>
:root{color-scheme:dark;--bg:#101113;--panel:#191b1e;--line:#303238;--muted:#a3a5ad;--text:#eeeeef;--gold:#ddc39a;--red:#ff817c;--green:#80c5aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:var(--text);background:#26282d;border:1px solid #3b3e45;border-radius:9px;min-height:44px;padding:9px 14px}button:hover{border-color:var(--gold)}button:disabled{opacity:.4;cursor:default}.primary{background:var(--gold);color:#161616;border-color:var(--gold);font-weight:650}.danger{color:var(--red)}input,select{max-width:100%;width:100%;border:1px solid #454851;background:#111215;color:var(--text);padding:12px;border-radius:8px;min-height:46px}label{display:block;color:var(--muted);font-size:14px;margin-bottom:5px}header{max-width:1180px;margin:auto;padding:24px 22px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}.brand{font-size:24px;letter-spacing:5px;font-weight:750}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.sub{color:var(--muted);font-size:14px}main{max-width:1180px;margin:auto;padding:24px 22px 120px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:25px}.controls{display:flex;gap:8px;flex-wrap:wrap}h1{font-size:27px;font-weight:600;letter-spacing:-.7px;margin:0 0 4px}h2{font-size:19px;margin:0 0 16px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0 14px}.hero{border-bottom:1px solid var(--line);padding:2px 0 26px;margin-bottom:22px}.big{font-size:clamp(32px,7vw,52px);letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1.3;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}.stat{border-left:2px solid #53565c;padding:3px 0 3px 13px}.stat strong{display:block;font-size:20px;font-weight:550;font-variant-numeric:tabular-nums}.card{background:var(--panel);padding:20px;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;min-width:0}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border-bottom:0}.right{text-align:right}.num{font-variant-numeric:tabular-nums;white-space:nowrap}.good{color:var(--green)}.bad{color:var(--red)}.gold{color:var(--gold)}.tag{font-size:12px;border:1px solid #494b52;padding:3px 8px;border-radius:6px;color:var(--muted);display:inline-block}.list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.form .wide{grid-column:1/-1}nav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,21,24,.98);border-top:1px solid var(--line);padding:8px 10px max(10px,env(safe-area-inset-bottom));z-index:10;display:flex;justify-content:center;gap:5px}nav button{border:0;background:none;color:var(--muted);font-size:13px;padding:10px 12px;min-width:65px}nav button.active{color:var(--gold);background:#2d2923}details{margin:12px 0}summary{cursor:pointer;color:var(--gold);padding:10px 0;min-height:44px}.notice{border-left:3px solid var(--gold);padding:12px 16px;background:#24221f;margin-bottom:20px;font-size:14px}.bar{height:7px;background:#303238;border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;background:var(--gold);height:100%}#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:14px 20px;border:1px solid #6c604c;background:#29251f;color:white;border-radius:10px;z-index:30;width:max-content;max-width:90vw;box-shadow:0 8px 35px #0009}#toast:empty{display:none}.ledger{font-size:14px}.ledger .row{align-items:start}.empty{color:var(--muted);padding:18px 0}.spark{width:100%;height:100px;display:block;margin:14px 0}.spaced{margin-top:20px}footer{font-size:13px;color:var(--muted);margin-top:25px}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}a{color:var(--gold)}@media(max-width:650px){header{padding:18px 16px}.brand{font-size:21px}main{padding:20px 16px 120px}.grid{grid-template-columns:1fr;gap:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat strong{font-size:18px}.card{padding:16px}.row{gap:8px}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}nav{gap:0;padding-left:2px;padding-right:2px}nav button{min-width:0;flex:1;padding:10px 3px;font-size:12px}.hide-mobile{display:none}.big{letter-spacing:-1px}.num{white-space:normal;overflow-wrap:anywhere}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
nav{overflow-x:auto;justify-content:flex-start;scrollbar-width:thin}nav button{flex:0 0 auto;min-width:62px}@media(min-width:700px){nav{justify-content:center}}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}</style><script src="./app.js" defer></script></head><body><header><div><div class="brand">STATE<span class="gold">.</span></div><div class="eyebrow">Республика Астер</div></div><div class="right"><div id="date">День 1</div><div class="sub">Финансовая песочница · 0.3</div></div></header><main id="app"><p>Создание республики: население, компании и счета…</p></main><nav id="nav" aria-label="Разделы игры"></nav><div id="toast" role="status" aria-live="polite"></div><noscript>Для игры необходимо включить JavaScript.</noscript></body></html>
