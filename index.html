<title>market-sandbox</title>

  html, body, #root { height: 100%; margin: 0; background: #0B0E14; }
  body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }

<!--
  window.storage is an API that only exists inside Claude.ai's artifact viewer. This shim gives the
  app the same shape (get/set/delete/list, matching {key,value,shared} results) backed by the
  browser's own localStorage, so the exact same app code works standalone on a real site.
-->
<script>
  (function () {
    const PREFIX = "marketsandbox:";
    function fullKey(key, shared) { return PREFIX + (shared ? "shared:" : "priv:") + key; }
    window.storage = {
      async get(key, shared) {
        const v = localStorage.getItem(fullKey(key, shared));
        if (v === null) return null;
        return { key, value: v, shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem(fullKey(key, shared), value);
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem(fullKey(key, shared));
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared) {
        const marker = fullKey(prefix || "", shared);
        const keys = Object.keys(localStorage)
          .filter((k) => k.startsWith(PREFIX + (shared ? "shared:" : "priv:")) && k.startsWith(marker))
          .map((k) => k.slice((PREFIX + (shared ? "shared:" : "priv:")).length));
        return { keys, prefix, shared: !!shared };
      },
    };
  })();
</script>
