<!doctype html>
<html lang="ru">
<head>

<meta name="description" content="Построй свой бизнес в самостоятельной экономике. Торговля, компании, банки и последствия твоих решений.">
<style>

:root{color-scheme:dark;--bg:#0D0E10;--surface:#17191D;--raised:#22252B;--line:#343840;--text:#F1F3F6;--muted:#A7ADB7;--accent:#80B9FF;--gold:var(--accent);--blue:var(--accent);--green:#52D69B;--red:#FF858D;--warn:#EBC074;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px}
*{box-sizing:border-box}body{margin:0 auto;max-width:520px;background:var(--bg);color:var(--text);line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;max-width:100%;padding:11px 14px;background:var(--raised);border:1px solid var(--line);border-radius:11px;color:var(--text);font-size:.875rem;font-weight:600;cursor:pointer;touch-action:manipulation;line-height:1.35}
button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.primary,button.primary{background:var(--accent);color:#0C2037;border-color:var(--accent)}.danger{background:#45272B;color:#FFADB3;border-color:#88525A}.link,.back{background:transparent;border:0;color:var(--accent);padding:8px 0}.back{color:var(--muted);margin-bottom:10px}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand-mark{display:none}.brand b{font-size:1.125rem}.brand small{display:block;color:var(--muted);font-size:.75rem;letter-spacing:.03em}.header-right button{background:transparent;min-width:44px}
.world-clock{padding:0 18px 12px;border-bottom:1px solid var(--line)}.clock-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.75rem}.clock-meta small{font-size:inherit}#time{display:none}
main{padding:20px 16px 120px;margin:auto;max-width:520px;min-width:0}h1,h2,h3,p{margin-top:0}h1{font-size:1.5rem;line-height:1.25;margin-bottom:16px;letter-spacing:-.02em}h2{font-size:1.125rem;line-height:1.4;margin-bottom:14px}h3{font-size:1rem;margin-bottom:10px}p{font-size:1rem;color:var(--muted);margin-bottom:16px}p:last-child{margin-bottom:0}small{font-size:.75rem}
.muted,.sub{font-size:.875rem;color:var(--muted);line-height:1.55}.eyebrow{font-size:.875rem;color:var(--muted)}.big{font-size:2rem;line-height:1.3;font-weight:650;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:8px 0;overflow-wrap:anywhere}
.balance{margin-bottom:18px}.wallet-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.wallet-cards section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;display:flex;flex-direction:column;justify-content:space-between;min-height:142px}.wallet-cards small{color:var(--muted);font-size:.875rem}.wallet-cards strong{font-size:clamp(1.1rem,5vw,1.6rem);letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:10px 0;overflow-wrap:anywhere}.wallet-link{background:#263A51;color:var(--accent);border:0;width:100%}.mini-chart{width:100%;height:32px;display:block}
.quick{display:flex;gap:8px;flex-wrap:wrap}.quick>button{flex:1}.balance .quick>button{background:var(--raised);border:1px solid var(--line);padding:12px;color:var(--text)}
.card,.hero,.news-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;min-width:0}.card .card{background:var(--bg)}.hero{border:0;border-left:3px solid var(--accent);border-radius:0 12px 12px 0}.hero .sub{font-size:.875rem}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h1,.section-head h2{margin:0}.section-head>button{flex-shrink:0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}.stat>span{display:block;color:var(--muted);font-size:.875rem}.stat strong{display:block;margin-top:7px;font-size:1.125rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.stat small{display:block;color:var(--muted)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.875rem}.row:last-child{border-bottom:0}.row>div{min-width:0;flex:1}.row strong{font-weight:400}.row .value{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;max-width:60%;overflow-wrap:anywhere}.row .muted{font-size:.75rem;margin-top:4px}.good{color:var(--green)}.bad{color:var(--red)}
.notice{padding:14px;background:#2B251B;border:1px solid #78623C;color:#F3D49D;border-radius:12px;margin-bottom:16px;font-size:.875rem}.attention{border-left:3px solid var(--warn)}.alert-row{display:flex;justify-content:space-between;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0;color:var(--warn);border-radius:0;font-size:.875rem}
.empty{border:1px solid var(--line);padding:18px;border-radius:14px;background:var(--surface);margin:14px 0}.empty h2{margin-bottom:8px}.empty p{font-size:.875rem}.empty .link{width:100%;justify-content:flex-start}
.business-card{width:100%;display:flex;text-align:left;justify-content:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);padding:15px;margin-bottom:10px;border-radius:12px}.business-card>span:nth-child(2){flex:1;min-width:0}.business-card strong{display:block;font-size:1rem}.business-card small,.business-card .muted{display:block;font-size:.875rem;font-weight:400;color:var(--muted)}.tile-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#253449;color:var(--accent);border-radius:10px}.chevron{color:var(--muted);font-size:1.4rem}
.launch-card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;gap:12px;align-items:flex-start;justify-content:flex-start;text-align:left;margin-bottom:12px}.launch-card>span:nth-child(2){flex:1;min-width:0}.launch-card strong{font-size:1rem}.launch-card p{font-weight:400;font-size:.875rem;margin:8px 0}.launch-card small{color:var(--accent);font-size:.875rem}
.company-title{display:flex;align-items:center;gap:12px;margin:8px 0 16px}.company-title small{color:var(--muted);font-size:.875rem}.company-title h1{font-size:1.35rem;margin:3px 0;overflow-wrap:anywhere}.page-heading{margin:12px 0}
.subtabs{display:flex;overflow-x:auto;gap:6px;margin-bottom:18px;scrollbar-width:none;padding-bottom:4px}.subtabs button{flex-shrink:0;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);white-space:nowrap}.subtabs button.active{border-bottom-color:var(--accent);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:.875rem;min-width:0;margin-bottom:16px}.input-shell{display:flex;align-items:center;gap:8px;border:1px solid #50565F;background:var(--bg);border-radius:10px;min-width:0}.input-shell:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.currency-prefix{padding-left:12px;font-size:1rem;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;color:var(--text);font-size:1rem;min-height:48px;padding:12px;background:var(--bg);border:1px solid #50565F;border-radius:10px;font-variant-numeric:tabular-nums}.input-shell input{border:0;background:transparent;outline-offset:1px}.field input[aria-invalid=true]{border-color:var(--red)}select{text-overflow:ellipsis}input[type=range]{accent-color:var(--accent)}
.form{display:grid;grid-template-columns:1fr;gap:0 12px}form+form{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}form>button:not([type=button]):last-child{width:100%}.form-preview{background:var(--bg);border-radius:10px;padding:4px 12px;margin:14px 0}.form-preview .row{font-size:.875rem}.form-preview p{font-size:.875rem;margin:10px 0}.form-preview:empty{display:none}.inline-error{color:var(--red);font-size:.875rem;line-height:1.5;padding:8px 0}
details{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}summary{cursor:pointer;min-height:44px;font-size:.875rem;font-weight:600}details[open]>summary{margin-bottom:12px}details p{font-size:.875rem}.balance-details{margin:16px 0 20px}.business-actions{margin-bottom:14px}
.flow-card{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:14px 0}.flow-card .section-head{font-size:.875rem;flex-wrap:wrap}.flow-card b{font-size:1.125rem;font-variant-numeric:tabular-nums}.flow-card small{font-size:.75rem;color:var(--muted)}.cycle-track{height:4px;background:var(--raised);border-radius:4px;overflow:hidden;margin:12px 0}.cycle-track span{height:100%;display:block;background:var(--accent);transition:width .25s linear}.flow-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.75rem;color:var(--muted)}.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);vertical-align:middle}
.list{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.spaced{margin-top:14px}.tag{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.75rem;color:var(--muted)}
.portfolio-row,.asset-row{display:flex;justify-content:space-between;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 0;gap:12px}.portfolio-row strong,.asset-row strong{display:block;font-size:.875rem;font-variant-numeric:tabular-nums}.portfolio-row small,.asset-row small{display:block;font-size:.75rem;color:var(--muted);font-weight:400;margin-top:4px}.portfolio-row>span:last-child,.asset-row>span:last-child{text-align:right;flex-shrink:0}.portfolio-row .good,.asset-row .good{color:var(--green)}.portfolio-row .bad,.asset-row .bad{color:var(--red)}
.market-list{background:var(--surface);padding:0 14px;border-radius:12px}.market-summary{margin-bottom:16px}.asset-row:last-child{border:0}
.asset-sheet{position:fixed;top:calc(env(safe-area-inset-top) + 44px);bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:var(--surface);z-index:40;border-radius:20px 20px 0 0;padding:16px 14px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;box-shadow:0 0 0 100vmax #000B}
.sheet-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.875rem;color:var(--muted);margin-bottom:12px}.sheet-heading button{min-width:44px;padding:8px}.exchange{margin-bottom:16px}.market-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.pair{background:transparent;border:0;padding:0;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}.pair strong{font-size:1.125rem}.pair small{font-size:.75rem;color:var(--muted)}.market-price{text-align:right}.market-price strong{display:block;font-size:1.625rem;letter-spacing:-.025em;font-variant-numeric:tabular-nums}.market-price small{display:block;font-size:.75rem}
.market-metrics{display:flex;flex-wrap:wrap;gap:8px 14px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--muted)}.market-metrics b{font-weight:500;color:var(--text)}.trade-layout{display:block}.chart-area{min-width:0}.chart-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}.chart-tools>.muted{font-size:.75rem}
.segments{display:flex;gap:4px}.segments button{background:transparent;border:0;padding:8px 12px;color:var(--muted)}.segments button.active{background:#293B50;color:var(--accent)}.candle-chart{width:100%;height:280px;display:block;background:#101114}.interactive-chart{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}.chart-legend{display:none}.chart-note{font-size:.75rem;color:var(--muted);padding:8px 0}
.candle-readout{border:0;margin:0;padding:6px 0}.candle-readout summary{font-size:.75rem;color:var(--muted)}.candle-readout strong{font-size:.75rem}.candle-readout>div>div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.candle-readout span{font-size:.75rem;color:var(--muted);min-width:0}.candle-readout b{display:block;color:var(--text);font-weight:500;font-size:.875rem;overflow-wrap:anywhere}
.chart-nav{display:flex;gap:4px;align-items:center;padding:8px 0}.chart-nav button{padding:8px 10px;font-size:.875rem}.chart-nav button:nth-child(4){flex:1}.history-range{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}.history-range input{width:100%;min-height:44px}
.order-panel{padding:12px 0}.side-switch{display:flex;gap:8px}.side-switch button{width:50%;background:var(--raised);font-size:1rem}.buy,.side-switch .selected.buy{background:var(--green);border-color:var(--green);color:#08271A}.sell,.side-switch .selected.sell{background:var(--red);border-color:var(--red);color:#311316}.order-types{margin:12px 0}.amount-mode{margin-bottom:12px}.amount-mode button{flex:1}
.available{display:flex;justify-content:space-between;gap:12px;font-size:.875rem;color:var(--muted);margin-bottom:12px}.available b{color:var(--text)}.quantity-stepper{display:flex;align-items:center;gap:8px}.quantity-stepper>.field{flex:1}.quantity-stepper>button{font-size:1.3rem;padding:8px;min-width:44px;margin-top:12px}.quantity-stepper input{text-align:center}
.percent-buttons{display:flex;gap:6px;margin:4px 0 12px}.percent-buttons button{flex:1;padding:8px 4px;background:transparent;font-size:.875rem}.quote-box{padding:0;margin:14px 0}.quote-box .row{font-size:.875rem}.quote-box small{display:block;color:var(--muted);font-size:.75rem;padding-top:8px}.order-panel .quote-box>.row:nth-child(n+5),.order-panel .quote-box>small{display:none}.execute{width:100%;min-height:50px;font-size:1rem}.order-panel>p{font-size:.875rem}
.tape-panel{margin:12px 0}.tape-row{display:flex;justify-content:space-between;font-size:.875rem;padding:7px 0;font-variant-numeric:tabular-nums}.tape-row span{color:var(--muted)}.market-records{padding:14px 0}.order-record{padding:8px 0 12px;border-bottom:1px solid var(--line)}.realized{font-size:.875rem}
.liquidity-table{overflow-x:auto}.liquidity-table table{width:100%;border-collapse:collapse;font-size:.875rem;font-variant-numeric:tabular-nums}.liquidity-table th{color:var(--muted);font-weight:500;text-align:right}.liquidity-table td{text-align:right;padding:10px 6px;border-bottom:1px solid var(--line)}.liquidity-table td:first-child,.liquidity-table th:first-child{text-align:left}.liquidity-table small{display:block;color:var(--muted)}
.news-refresh{width:100%;background:transparent;border:0;color:var(--accent);margin-bottom:12px}.news-byline{display:flex;align-items:center;gap:10px;margin-bottom:14px}.publisher-mark{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--muted)}.news-byline strong{display:block;font-size:.875rem}.news-byline small{display:block;color:var(--muted);font-size:.75rem}.news-card h2{font-size:1.125rem;line-height:1.4}.news-card p{font-size:1rem;line-height:1.65;color:#BFC5CE}
.drawer-backdrop,.modal-backdrop{position:fixed;inset:0;background:#000B;z-index:60}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:61;background:var(--surface);padding:calc(env(safe-area-inset-top) + 18px) 18px 24px;overflow:auto}.modal-backdrop{z-index:70;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(520px,100%);max-height:90dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}.trade-confirm .quick{margin-top:18px}.confirm-direction{font-size:1.3rem;font-weight:600;margin-bottom:12px}
#nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;display:flex;gap:4px;padding:6px 10px calc(env(safe-area-inset-bottom) + 7px);background:var(--surface);border-top:1px solid var(--line);z-index:30}#nav button{flex:1;background:transparent;border:0;border-radius:0;flex-direction:column;gap:4px;color:var(--muted);font-size:.75rem;padding:8px 4px;min-height:58px}#nav button.active{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);width:max-content;z-index:100;background:#DAE8FA;color:#112033;border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px #0009;font-size:.875rem}#toast:empty{display:none}
#app[data-detail]:not([data-detail=""]):not([data-detail="overview"])>.hero,#app[data-detail]:not([data-detail=""]):not([data-detail="overview"])>.stats,#app[data-detail]:not([data-detail=""]):not([data-detail="overview"])>.business-actions,#app[data-detail]:not([data-detail=""]):not([data-detail="overview"])>.balance-details{display:none}
@media(min-width:600px){body{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100dvh}}
@media(max-width:350px){main{padding-left:12px;padding-right:12px}.wallet-cards{grid-template-columns:1fr}.market-top{flex-wrap:wrap}.chart-nav{flex-wrap:wrap}.row{flex-wrap:wrap}.row .value{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">S</span><div><b>Мой капитал</b><small>Песочница рынка</small></div></div><div class="header-right"><button data-action="settings" aria-label="Сохранение и настройки">⚙</button></div></header>
<div class="world-clock"><div class="clock-meta"><span id="date">Новая игра</span><small id="status" role="status">Создаём жителей и компании…</small></div><div id="time"></div></div>
<main id="app" class="reading" aria-busy="true"><div class="empty"><h1>Добро пожаловать в Астер</h1><p>Готовим самостоятельный мир: жителей, компании, банки и их счета. Первая загрузка может занять несколько секунд.</p></div></main>
<nav id="nav" aria-label="Основные разделы"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./app.js"></script>
</body>
</html>
